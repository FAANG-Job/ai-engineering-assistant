spring.application.name=health-service
logging.file.name=C:/centralized-logs/order-service.log
management.endpoints.web.exposure.include=health,prometheus

server.port=8080

# Trust tokens issued by our Keycloak realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/interview-poc

# Accept only tokens intended for this API
spring.security.oauth2.resourceserver.jwt.audiences=health-service